<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>einox · 会话回放</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.5 "SF Mono", Menlo, Consolas, monospace; background: #16181d; color: #cdd3de; display: flex; height: 100vh; }
  #side { width: 260px; border-right: 1px solid #2a2e37; overflow-y: auto; padding: 10px; flex-shrink: 0; }
  #side h1 { font-size: 13px; color: #7aa2f7; margin-bottom: 8px; }
  #side .sess { padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
  #side .sess:hover { background: #1f232c; }
  #side .sess.on { background: #242a38; outline: 1px solid #364156; }
  #side .sess .t { color: #e6e9ef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side .sess .m { color: #5b647a; font-size: 11px; display: flex; gap: 6px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { padding: 8px 12px; border-bottom: 1px solid #2a2e37; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar button { background: #242a38; color: #cdd3de; border: 1px solid #364156; border-radius: 5px; padding: 3px 10px; cursor: pointer; font: inherit; }
  #bar button:hover { background: #2d3548; }
  #bar .grow { flex: 1; }
  #bar input { background: #1a1d24; border: 1px solid #364156; color: #cdd3de; border-radius: 5px; padding: 3px 8px; font: inherit; width: 160px; }
  #body { flex: 1; display: flex; min-height: 0; }
  #tl { flex: 1.4; overflow-y: auto; padding: 10px 12px; }
  .ev { display: flex; gap: 8px; padding: 3px 6px; border-radius: 5px; cursor: pointer; align-items: baseline; }
  .ev:hover { background: #1f232c; }
  .ev.on { background: #242a38; outline: 1px solid #364156; }
  .ev.dim { opacity: .35; }
  .ev .id { color: #5b647a; width: 34px; text-align: right; flex-shrink: 0; }
  .ev .kind { font-size: 11px; padding: 0 6px; border-radius: 4px; flex-shrink: 0; }
  .ev .sum { color: #aab3c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .tsc { color: #e6e9ef; }
  #insp { flex: 1; border-left: 1px solid #2a2e37; overflow: auto; padding: 10px 12px; }
  #insp h3 { color: #7aa2f7; margin-bottom: 6px; font-size: 12px; }
  #insp pre { white-space: pre-wrap; word-break: break-all; color: #9ece6a; font-size: 12px; }
  .k-gen { background: #1f2b3d; color: #7aa2f7; } .k-tool { background: #2d2a20; color: #e0af68; }
  .k-hitl { background: #33222e; color: #f7768e; } .k-ster { background: #1e2b26; color: #73daca; }
  .k-proc { background: #2a2438; color: #bb9af7; } .k-end { background: #2e2e2e; color: #a9b1d6; }
  .k-unknown { background: #2e2e2e; color: #5b647a; }
  #hint { color: #5b647a; padding: 30px; text-align: center; flex: 1; }
</style>
</head>
<body>
  <div id="side"><h1>会话</h1><div id="sessions"></div></div>
  <div id="main">
    <div id="bar">
      <button onclick="step(0)">⏮</button><button onclick="step(-1)">◀</button>
      <button id="play" onclick="play()">▶ 播放</button><button onclick="step(1)">▶｜</button><button onclick="step(1e9)">⏭</button>
      <span id="pos"></span><span class="grow"></span>
      <input id="filter" placeholder="Kind 过滤（子串）" oninput="renderTl()">
      <button onclick="loadEvents()">刷新</button>
    </div>
    <div id="body">
      <div id="tl"><div id="hint">左侧选择会话；数据 = 只读回放面（REST/SSE）</div></div>
      <div id="insp"><h3>事件检查器</h3><pre id="inspBody">选中时间轴事件查看载荷</pre></div>
    </div>
  </div>
<script>
"use strict";
// Kind 域着色 + 摘要提取（封闭词表渲染契约；未知 Kind 软降级通用卡片——
// docs/03 事件词表冻结保证增长可期、降级有底）
const DOMAINS = [
  ["k-gen",  e => /^(text_delta|thinking_delta|usage)$/.test(e)],
  ["k-tool", e => /^tool_(call|result)$/.test(e)],
  ["k-hitl", e => /^(approval|ask_user|plan)_/.test(e)],
  ["k-ster", e => /^(steer_|notify_|user_message$|participant_update$)/.test(e)],
  ["k-proc", e => /^(todo_update|harness_note|subagent|model_change|transport_retry)$/.test(e)],
  ["k-end",  e => /^(session_end|error|interrupted)$/.test(e)],
];
const SUMMARIES = {
  user_message: d => `消息${d.speaker_name ? "（" + d.speaker_name + "）" : ""}：` + (d.text || "（附件）"),
  text_delta: d => "文本：" + (d.delta || ""),
  thinking_delta: d => "思考…",
  usage: d => "用量上报",
  tool_call: d => "调用 " + (d.tool || "?"),
  tool_result: d => (d.ok ? "✓ " : "✗ ") + (d.digest || d.tool || ""),
  approval_request: d => `审批：${d.tool || "?"}${d.requester_name ? "（" + d.requester_name + " 的动作）" : ""}${d.target_name ? " → 问 " + d.target_name : ""}`,
  approval_decision: d => (d.approve ? "批准" : "拒绝") + (d.decider_name ? "（" + d.decider_name + "）" : ""),
  approval_timeout: () => "审批超时（fail-closed 拒）",
  harness_note: d => `${d.kind || ""}：${d.title || ""}`,
  subagent: d => `子代理 ${d.kind}${d.stop_reason ? "（" + d.stop_reason + "）" : ""}`,
  participant_update: d => `名册：${d.participant?.name || d.participant?.id} ${d.kind}`,
  session_end: d => `轮末（历史 ${d.hist_len} 条）`,
  error: d => `错误 ${d.code}：${(d.message || "").slice(0, 60)}`,
  interrupted: () => "打断（非故障）",
  transport_retry: d => `重连 ${d.attempt || "?"}/${d.max || "?"}`,
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const domOf = kind => (DOMAINS.find(([, f]) => f(kind)) || [, "k-unknown"])[1];
const sumOf = ev => { const f = SUMMARIES[ev.event]; return f ? f(ev.data || {}) : "（未知事件——软降级通用卡片）"; };

let cur = null, events = [], cursor = 0, timer = null;
const $ = id => document.getElementById(id);

async function loadSessions() {
  const rs = await fetch("/api/sessions");
  const list = await rs.json();
  $("sessions").innerHTML = (list || []).map(s =>
    `<div class="sess" data-sid="${esc(s.sid)}"><div class="t">${esc(s.title || s.sid)}</div>
     <div class="m"><span>${esc(s.owner)}</span><span>${esc(s.state)}</span></div></div>`).join("");
  for (const el of $("sessions").children)
    el.onclick = () => pick(el.dataset.sid);
}
async function pick(sid) {
  cur = sid; cursor = 0;
  for (const el of $("sessions").children) el.classList.toggle("on", el.dataset.sid === sid);
  await loadEvents();
}
async function loadEvents() {
  if (!cur) return;
  const rs = await fetch(`/api/sessions/${cur}/events`);
  events = await rs.json(); cursor = events.length; renderTl(); showPos();
}
function step(d) {
  if (!events.length) return;
  cursor = Math.max(0, Math.min(events.length, cursor + d));
  renderTl(); showPos();
}
function play() {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ 播放"; return; }
  $("play").textContent = "⏸ 暂停";
  timer = setInterval(() => { if (cursor >= events.length) { play(); return; } step(1); }, 350);
}
function renderTl() {
  const f = $("filter").value.trim().toLowerCase();
  const shown = new Set(events.slice(0, cursor).filter(ev => !f || ev.event.includes(f)).map(ev => ev.id));
  const sel = ev => ev.id === lastSel;
  let lastSel = null;
  const rows = events.map(ev => {
    const on = shown.has(ev.id);
    return `<div class="ev ${on ? "" : "dim"}${sel(ev) ? " on" : ""}" data-id="${ev.id}">
      <span class="id">${ev.id}</span><span class="kind ${domOf(ev.event)}">${esc(ev.event)}</span>
      <span class="sum${ev.event === "text_delta" ? " tsc" : ""}">${esc(sumOf(ev))}</span></div>`;
  }).join("");
  $("tl").innerHTML = rows || '<div id="hint">无事件</div>';
  for (const el of $("tl").querySelectorAll(".ev"))
    el.onclick = () => inspect(+el.dataset.id);
}
let lastSel = null;
function inspect(id) {
  lastSel = id;
  const ev = events.find(e => e.id === id);
  if (!ev) return;
  $("inspBody").textContent = `#${ev.id} ${ev.event}\n\n` + JSON.stringify(ev.data, null, 2);
  for (const el of $("tl").querySelectorAll(".ev")) el.classList.toggle("on", +el.dataset.id === id);
}
function showPos() { $("pos").textContent = `${cursor}/${events.length}`; }
loadSessions();
</script>
</body>
</html>
